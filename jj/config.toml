"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Alvin Shen"
email = "29553973+alven-shin@users.noreply.github.com"

[aliases]
init = ["git", "init", "--colocate"]
clone = ["git", "clone", "--colocate"]
fetch = ["git", "fetch"]
push = ["git", "push"]
hist = ["log", "-T", "hist", "-r", "all()"]

[ui]
default-command = "status"
# pager = "delta"
# diff-formatter = ":git"

# Prevent pushing work in progress or anything explicitly labeled "private"
[git]
private-commits = "description('wip:*') | description('private:*')"

[revsets]
log = '@ | ancestors(remote_bookmarks().., 2) | trunk()'

[templates]
draft_commit_description = '''
concat(
  builtin_draft_commit_description,
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''

[template-aliases]
'format_short_signature(signature)' = 'signature.name()'
hist = 'hist(self)'
'hist(commit)' = '''
if(commit.root(),
  format_root_commit(commit),
  label(
    separate(" ",
      if(commit.current_working_copy(), "working_copy"),
      if(commit.immutable(), "immutable", "mutable"),
      if(commit.conflict(), "conflicted"),
    ),
    separate(" ",
      format_short_change_id_with_change_offset(commit),
      commit_timestamp(commit).format("%Y-%m-%d"),
      if(commit.description(),
        commit.description().first_line(),
        label(if(commit.empty(), "empty"), description_placeholder),
      ),
      surround("[", "]", commit.author().name()),
      format_short_commit_id(commit.commit_id()),
      format_commit_labels(commit),
      commit.bookmarks(),
      commit.tags(),
      commit.working_copies(),
      if(config("ui.show-cryptographic-signatures").as_boolean(),
        format_short_cryptographic_signature(commit.signature())
      ),
      if(commit.empty(), empty_commit_marker),
    ) ++ "\n",
  )
)
'''
